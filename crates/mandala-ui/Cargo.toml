[package]
name = "mandala-ui"
description = "Slint declarative UI for the Mandala tri-panel launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
mandala-core = { workspace = true }
# Backends/renderers are chosen by the final binary (see mandala-shell).
slint = { version = "1.9", default-features = false, features = ["std", "compat-1-2"] }

[build-dependencies]
slint-build = "1.9"

[dev-dependencies]
# Headless backend for the focus-loop test: injects Tab/Enter/Escape into
# the real MainWindow without a display. `ffi` unlocks the raw key-sender
# (the `internal` feature does not compile from crates.io: it include_bytes!
# font files that only exist in Slint's git repo).
i-slint-backend-testing = { version = "1.18", features = ["ffi"] }
# WindowAdapterRc access for that key-sender (same 1.18.1 the lock already uses).
i-slint-core = "1.18"
