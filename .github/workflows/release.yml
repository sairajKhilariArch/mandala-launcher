name: Release

# Push a tag like v0.1.0 to build, test, package and publish a GitHub Release.
# workflow_dispatch builds the artifacts without publishing (dry run).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64,   prefix: lib, ext: so,    exe: "" }
          - { os: macos-latest,   name: macos-arm64,    prefix: lib, ext: dylib, exe: "" }
          - { os: windows-latest, name: windows-x86_64, prefix: "",  ext: dll,   exe: ".exe" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release --workspace

      - name: Package
        env:
          # Optional: sign the example modules in CI. Secret = hex Ed25519
          # secret key from `mandala-sign keygen`; variable = matching hex
          # public key. Without them modules are shipped unsigned.
          SIGNING_KEY: ${{ secrets.MANDALA_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.MANDALA_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          NAME="mandala-${VERSION}-${{ matrix.name }}"
          D="dist/${NAME}"
          REL=target/release
          mkdir -p "$D/themes" "$D/modules-unsigned"
          cp "$REL/mandala-shell${{ matrix.exe }}" "$REL/mandala-sign${{ matrix.exe }}" "$D/"
          cp themes/*.json "$D/themes/"
          cp README.md "$D/"
          for m in app_notes app_calculator app_terminal app_aegis app_vault app_localsend \
                   app_weather app_rss app_tasks app_reader app_gallery app_chat app_ai app_camera; do
            cp "$REL/${{ matrix.prefix }}${m}.${{ matrix.ext }}" "$D/modules-unsigned/"
          done

          if [ -n "${SIGNING_KEY:-}" ] && [ -n "${PUBLIC_KEY:-}" ]; then
            umask 077
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/host.key"
            mkdir -p "$D/mandala-home/trust"
            printf '%s\n' "$PUBLIC_KEY" > "$D/mandala-home/trust/host.pub"
            "$REL/mandala-sign${{ matrix.exe }}" install \
              --home "$D/mandala-home" --key "$RUNNER_TEMP/host.key" \
              "$D"/modules-unsigned/*
            rm -f "$RUNNER_TEMP/host.key"
            rm -rf "$D/modules-unsigned"
            echo "Modules signed."
          else
            echo "::warning::MANDALA_SIGNING_KEY / MANDALA_PUBLIC_KEY not set: shipping unsigned modules."
          fi

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${NAME}.zip" "${NAME}" > /dev/null
            ARCHIVE="${NAME}.zip"
          else
            tar czf "${NAME}.tar.gz" "${NAME}"
            ARCHIVE="${NAME}.tar.gz"
          fi
          (sha256sum "$ARCHIVE" 2>/dev/null || shasum -a 256 "$ARCHIVE") > "${ARCHIVE}.sha256"
          rm -rf "${NAME}"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # Android: cross-compile the NativeActivity cdylib and package it into an APK
  # with cargo-apk2 (Slint's maintained fork of cargo-apk — plain cargo-apk has
  # not kept up with newer SDK layouts and has no 0.22 release, which is what
  # broke this job). cargo-apk2 reads [package.metadata.android] from
  # crates/mandala-shell/Cargo.toml, so the activity, permissions and
  # HOME/LAUNCHER filters live next to the code. The runner image ships the SDK,
  # an NDK and a JDK, so only the two cargo tools need installing.
  android:
    name: Build android-arm64 (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk2 and cargo-ndk
        run: |
          # Pinned, but not --locked: whether a published crate ships a
          # Cargo.lock varies and an install failure here has no value.
          cargo install cargo-apk2 --version 1.5.0
          cargo install cargo-ndk --version 4.1.2
      # d8/R8 in build-tools cannot read class files from very new JDKs
      # ("Unsupported class file major version 69" with JDK 25). Pin 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare the APK signing key
        env:
          KEYSTORE_B64: ${{ secrets.MANDALA_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.MANDALA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # cargo-apk2 refuses to package a release APK without a keystore, and
          # only auto-generates one for the dev profile. A stable key from the
          # secret lets an installed APK be updated later; without it we still
          # produce something installable and say so.
          KEYSTORE="$RUNNER_TEMP/mandala-release.jks"
          PASSWORD="${KEYSTORE_PASSWORD:-android}"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            echo "Signing with MANDALA_ANDROID_KEYSTORE (key password must equal the store password)."
          else
            echo "::warning::MANDALA_ANDROID_KEYSTORE not set: signing with a throwaway key. The APK installs, but it cannot be updated over a build signed with another key."
            keytool -genkeypair -keystore "$KEYSTORE" -alias mandala \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -dname "CN=Mandala" -keyalg RSA -keysize 2048 -validity 10000 > /dev/null
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Locate the Android SDK and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$ANDROID_HOME" ] || [ -z "$ANDROID_NDK_HOME" ]; then
            echo "::error::no ANDROID_HOME / ANDROID_NDK_HOME on this runner"; exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "using SDK $ANDROID_HOME and NDK $ANDROID_NDK_HOME"
      - name: Build APK
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          cargo apk2 build --release --features android \
            --target aarch64-linux-android -p mandala-shell
          APK=target/release/apk/mandala.apk
          if [ ! -f "$APK" ]; then
            echo "::error::cargo-apk2 did not produce $APK"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/mandala-${VERSION}-android-arm64.apk"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"'/build-tools/'* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "dist/mandala-${VERSION}-android-arm64.apk"
      - name: Build and sign the slot modules for the device
        env:
          SIGNING_KEY: ${{ secrets.MANDALA_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.MANDALA_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          cargo ndk -t arm64-v8a build --release --lib \
            -p app-notes -p app-calculator -p app-terminal -p app-aegis \
            -p app-vault -p app-localsend -p app-weather -p app-rss \
            -p app-tasks -p app-reader -p app-gallery -p app-chat \
            -p app-ai -p app-camera
          cargo build --release -p mandala-sign
          D="dist/mandala-${VERSION}-android-arm64-modules"
          mkdir -p "$D/modules-unsigned"
          cp target/aarch64-linux-android/release/libapp_*.so "$D/modules-unsigned/"
          if [ -n "${SIGNING_KEY:-}" ] && [ -n "${PUBLIC_KEY:-}" ]; then
            umask 077
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/host.key"
            mkdir -p "$D/mandala-home/trust"
            printf '%s\n' "$PUBLIC_KEY" > "$D/mandala-home/trust/host.pub"
            target/release/mandala-sign install --home "$D/mandala-home" \
              --key "$RUNNER_TEMP/host.key" "$D"/modules-unsigned/*
            rm -f "$RUNNER_TEMP/host.key"
            rm -rf "$D/modules-unsigned"
            echo "Modules signed."
          else
            echo "::warning::MANDALA_SIGNING_KEY / MANDALA_PUBLIC_KEY not set: shipping unsigned modules."
          fi
          tar czf "dist/$(basename "$D").tar.gz" -C dist "$(basename "$D")"
          rm -rf "$D"
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *.apk *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}