name: Release

# Push a tag like v0.1.0 to build, test, package and publish a GitHub Release.
# workflow_dispatch builds the artifacts without publishing (dry run).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64,   prefix: lib, ext: so,    exe: "" }
          - { os: macos-latest,   name: macos-arm64,    prefix: lib, ext: dylib, exe: "" }
          - { os: windows-latest, name: windows-x86_64, prefix: "",  ext: dll,   exe: ".exe" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release --workspace

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          NAME="mandala-${VERSION}-${{ matrix.name }}"
          D="dist/${NAME}"
          REL=target/release
          mkdir -p "$D/themes"
          cp "$REL/mandala-shell${{ matrix.exe }}" "$REL/mandala-sign${{ matrix.exe }}" "$D/"
          cp themes/*.json "$D/themes/"
          cp README.md "$D/"
          # Shell-only archives: modules are released from their own branches
          # (mod/<id>), signed there with MANDALA_SIGNING_KEY, and installed
          # at runtime from the signed store (docs/module-store.md).

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${NAME}.zip" "${NAME}" > /dev/null
            ARCHIVE="${NAME}.zip"
          else
            tar czf "${NAME}.tar.gz" "${NAME}"
            ARCHIVE="${NAME}.tar.gz"
          fi
          (sha256sum "$ARCHIVE" 2>/dev/null || shasum -a 256 "$ARCHIVE") > "${ARCHIVE}.sha256"
          rm -rf "${NAME}"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # Android: cross-compile the NativeActivity cdylib and package it into an APK
  # with cargo-apk2 (Slint's maintained fork of cargo-apk — plain cargo-apk has
  # not kept up with newer SDK layouts and has no 0.22 release, which is what
  # broke this job). cargo-apk2 reads [package.metadata.android] from
  # crates/mandala-shell/Cargo.toml, so the activity, permissions and
  # HOME/LAUNCHER filters live next to the code. The runner image ships the SDK,
  # an NDK and a JDK, so only the two cargo tools need installing.
  android:
    name: Build android-arm64 (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk2 and cargo-ndk
        run: |
          # Pinned, but not --locked: whether a published crate ships a
          # Cargo.lock varies and an install failure here has no value.
          cargo install cargo-apk2 --version 1.5.0
          cargo install cargo-ndk --version 4.1.2
      # d8/R8 in build-tools cannot read class files from very new JDKs
      # ("Unsupported class file major version 69" with JDK 25). Pin 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare the APK signing key
        env:
          KEYSTORE_B64: ${{ secrets.MANDALA_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.MANDALA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # cargo-apk2 refuses to package a release APK without a keystore, and
          # only auto-generates one for the dev profile. A stable key from the
          # secret lets an installed APK be updated later; without it we still
          # produce something installable and say so.
          KEYSTORE="$RUNNER_TEMP/mandala-release.jks"
          PASSWORD="${KEYSTORE_PASSWORD:-android}"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            echo "Signing with MANDALA_ANDROID_KEYSTORE (key password must equal the store password)."
          else
            echo "::warning::MANDALA_ANDROID_KEYSTORE not set: signing with a throwaway key. The APK installs, but it cannot be updated over a build signed with another key."
            keytool -genkeypair -keystore "$KEYSTORE" -alias mandala \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -dname "CN=Mandala" -keyalg RSA -keysize 2048 -validity 10000 > /dev/null
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Locate the Android SDK and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$ANDROID_HOME" ] || [ -z "$ANDROID_NDK_HOME" ]; then
            echo "::error::no ANDROID_HOME / ANDROID_NDK_HOME on this runner"; exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "using SDK $ANDROID_HOME and NDK $ANDROID_NDK_HOME"
      - name: Build APK
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          # --lib is required: mandala-shell also has a [[bin]] target, and
          # cargo-apk2's artifact resolver then picks the bin and panics with
          # "Bin is not compatible with Cdylib" *after* writing the APK, which
          # still fails the step (exit 101).
          cargo apk2 build --release --features android --lib \
            --target aarch64-linux-android -p mandala-shell
          APK=target/release/apk/mandala.apk
          if [ ! -f "$APK" ]; then
            echo "::error::cargo-apk2 did not produce $APK"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/mandala-${VERSION}-android-arm64.apk"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"'/build-tools/'* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "dist/mandala-${VERSION}-android-arm64.apk"
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}