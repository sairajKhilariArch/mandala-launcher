name: Module release

# One module, one pipeline. Pushing a tag like `app-notes/v1.2.0` builds and
# signs that single module for both Android ABIs and publishes it to the
# orphan `store` branch, which GitHub Pages serves as the module catalog.
#
# `main` only ever ships the shell (APK/desktop) — module bytes never enter
# the APK; they are installed at runtime by the in-app store and verified
# against the release public key baked into the launcher
# (crates/mandala-shell/release.pub).
#
# Release a module:
#   git tag app-notes/v1.2.0 && git push origin app-notes/v1.2.0
#
# Requires the repository secret MANDALA_SIGNING_KEY (hex Ed25519 secret key
# matching crates/mandala-shell/release.pub) and Pages enabled with
# Source = branch `store` (created by the first run).
on:
  push:
    tags: ["app-*/v*"]
  workflow_dispatch:
    inputs:
      module:
        description: "Module id, e.g. app-notes"
        required: true
      version:
        description: "Version, e.g. 1.2.0"
        required: true

permissions:
  contents: write

# Serialize publishes so two module releases cannot race on the store branch.
concurrency:
  group: store-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2

      - name: Resolve module and version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODULE="${{ inputs.module }}"
            VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF_NAME}"      # e.g. app-notes/v1.2.0
            MODULE="${REF%/v*}"
            VERSION="${REF##*/v}"
          fi
          # Validate before anything is built so a typo cannot half-publish.
          echo "$MODULE" | grep -Eq '^app-[a-z0-9-]+$' \
            || { echo "::error::bad module id '$MODULE'"; exit 1; }
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' \
            || { echo "::error::bad version '$VERSION'"; exit 1; }
          echo "module=$MODULE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Locate the Android SDK and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$ANDROID_HOME" ] || [ -z "$ANDROID_NDK_HOME" ]; then
            echo "::error::no ANDROID_HOME / ANDROID_NDK_HOME on this runner"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Build and sign ${{ steps.meta.outputs.module }}
        env:
          MODULE: ${{ steps.meta.outputs.module }}
          VERSION: ${{ steps.meta.outputs.version }}
          SIGNING_KEY: ${{ secrets.MANDALA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::MANDALA_SIGNING_KEY is not set — refusing to publish unsigned modules."
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/host.key"
          trap 'rm -f "$RUNNER_TEMP/host.key"' EXIT

          cargo ndk -t arm64-v8a -t x86_64 build --release --lib -p "$MODULE"
          cargo build --release -p mandala-sign

          # The launcher expects `<id>.so`; cargo names the artifact after the
          # crate (`libapp_notes.so`), so rename while publishing.
          CRATE="$(echo "$MODULE" | tr '-' '_')"
          for pair in "aarch64-linux-android:android-arm64" "x86_64-linux-android:android-x86_64"; do
            TARGET="${pair%%:*}"
            ABI="${pair##*:}"
            OUT="publish/modules/$ABI"
            mkdir -p "$OUT"
            cp "target/$TARGET/release/lib${CRATE}.so" "$OUT/$MODULE.so"
            ./target/release/mandala-sign sign --key "$RUNNER_TEMP/host.key" "$OUT/$MODULE.so"
            printf '%s\n' "$VERSION" > "$OUT/$MODULE.so.ver"
          done

      - name: Publish to the store branch
        env:
          MODULE: ${{ steps.meta.outputs.module }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          SRC="$PWD"
          WORK="$RUNNER_TEMP/store-branch"
          mkdir -p "$WORK"
          cd "$WORK"
          git init -q
          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin store; then
            # FETCH_HEAD is unconditional; remote-tracking refs are not.
            git checkout -q -B store FETCH_HEAD
          else
            # First publish: the orphan store branch has no history.
            git checkout -q --orphan store
          fi

          mkdir -p modules/android-arm64 modules/android-x86_64 registry
          for ABI in android-arm64 android-x86_64; do
            cp "$SRC"/publish/modules/"$ABI"/* "modules/$ABI/"
          done
          cp "$SRC"/store-site/index.html .

          # Regenerate the catalog from everything on the branch (not just this
          # module), verifying each signature against the committed key so a
          # mismatched MANDALA_SIGNING_KEY fails here rather than on devices.
          cd "$SRC"
          for ABI in android-arm64 android-x86_64; do
            ./target/release/mandala-sign registry \
              --abi "$ABI" \
              --dir "$WORK/modules/$ABI" \
              --manifests store/manifests \
              --out "$WORK/registry/$ABI.json" \
              --pub crates/mandala-shell/release.pub
          done

          cd "$WORK"
          git add -A
          git config user.name "mandala-store-bot"
          git config user.email "actions@users.noreply.github.com"
          # Republishing an identical version must not fail the job.
          if git diff --cached --quiet; then
            echo "store branch already up to date"
          else
            git commit -q -m "publish $MODULE $VERSION"
            git push -q origin store
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: module-${{ steps.meta.outputs.module }}-${{ steps.meta.outputs.version }}
          path: publish/modules
          if-no-files-found: error
