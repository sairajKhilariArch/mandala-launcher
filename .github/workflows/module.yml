name: Publish app-ai

# This module lives on its own branch (mod/app-ai); pushing app-ai/vX.Y.Z
# from that branch builds, tests, signs and publishes ONE module:
#
#   git switch mod/app-ai
#   git tag app-ai/v1.0.0 && git push origin mod/app-ai app-ai/v1.0.0
#
# Requires the repo secret MANDALA_SIGNING_KEY (the hex Ed25519 secret key
# whose public half is committed on main as
# crates/mandala-shell/release.pub). The store serving branch (`store`) and
# GitHub Pages must be enabled once with Source = branch `store`.
#
# Signing binaries come from a `main` checkout (path tooling/) so registry
# logic and release keys cannot drift per branch; site + module metadata
# come from the `website` branch.

on:
  push:
    tags: ["app-ai/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0"
        required: true

permissions:
  contents: write

# Two module publishes must not race on the store branch.
concurrency:
  group: store-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # this branch's tree (tag tree)
      - uses: actions/checkout@v4
        with:
          ref: main                        # mandala-sign + release.pub
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: website                     # site + module metadata
          path: website

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2

      - name: Resolve module and version
        id: meta
        run: |
          set -euo pipefail
          MODULE="app-ai"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME##*/v}"   # app-notes/v1.2.0 -> 1.2.0
          fi
          # Reject lockfile poison before anything is built.
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' \
            || { echo "::error::bad version '$VERSION'"; exit 1; }
          echo "module=$MODULE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Locate the Android SDK and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$ANDROID_HOME" ] || [ -z "$ANDROID_NDK_HOME" ]; then
            echo "::error::no ANDROID_HOME / ANDROID_NDK_HOME on this runner"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Build, test and sign app-ai
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SIGNING_KEY: ${{ secrets.MANDALA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::MANDALA_SIGNING_KEY is not set — refusing to publish unsigned modules."
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/host.key"
          trap 'rm -f "$RUNNER_TEMP/host.key"' EXIT

          # Regression gate: the module's own tests must pass on the host
          # before any artifact is built or published.
          cargo test --workspace

          # Android ABIs via cargo-ndk, plus the Linux desktop host ABI.
          cargo ndk -t arm64-v8a -t x86_64 build --release --lib -p "app-ai"
          cargo build --release --lib -p "app-ai"

          # Sign binaries from `main`, not this branch.
          (cd tooling && cargo build --release -p mandala-sign)
          TOOL=tooling/target/release/mandala-sign

          CRATE="app_ai"
          PUB=tooling/crates/mandala-shell/release.pub
          PUBLISH=publish/modules
          mkdir -p $PUBLISH/android-arm64 $PUBLISH/android-x86_64 $PUBLISH/linux-x86_64
          # The launcher resolves `<id>.so`; cargo emits `lib<crate>.so`.
          cp "target/aarch64-linux-android/release/lib${CRATE}.so" "$PUBLISH/android-arm64/app-ai.so"
          cp "target/x86_64-linux-android/release/lib${CRATE}.so"  "$PUBLISH/android-x86_64/app-ai.so"
          cp "target/release/lib${CRATE}.so"                       "$PUBLISH/linux-x86_64/app-ai.so"

          for f in $PUBLISH/*/*.so; do
            "$TOOL" sign --key "$RUNNER_TEMP/host.key" "$f"
            "$TOOL" verify --pub "$PUB" "$f" \
              || { echo "::error::secret key does not match the committed release.pub"; exit 1; }
            printf '%s\n' "$VERSION" > "$f.ver"
          done

      - name: Publish to the store branch
        env:
          MODULE: ${{ steps.meta.outputs.module }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          SRC="$PWD"
          WORK="$RUNNER_TEMP/store-branch"
          mkdir -p "$WORK"
          cd "$WORK"
          git init -q
          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin store; then
            git checkout -q -B store FETCH_HEAD
          else
            # First publish ever: the store branch has no history yet.
            git checkout -q --orphan store
            git rm -q -rf .
          fi

          mkdir -p modules registry
          cp -r "$SRC/publish/modules/"* modules/
          cp "$SRC/website/store-site/index.html" ./index.html

          # Regenerate each ABI catalog whose directory has any module
          # bytes — not just this module — so the published catalog always
          # covers every module and ABI on the branch.
          for ABI in android-arm64 android-x86_64 linux-x86_64; do
            DIR="$WORK/modules/$ABI"
            if [ -n "$(ls -A "$DIR" 2>/dev/null)" ]; then
              (cd "$SRC" && tooling/target/release/mandala-sign registry \
                --abi "$ABI" \
                --dir "$DIR" \
                --manifests "$SRC/website/store/manifests" \
                --out "$WORK/registry/$ABI.json" \
                --pub "$SRC/tooling/crates/mandala-shell/release.pub") \
                || { echo "::error::registry generation failed for $ABI"; exit 1; }
            fi
          done

          cd "$WORK"
          git add -A
          git config user.name "mandala-store-bot"
          git config user.email "actions@users.noreply.github.com"
          # Republishing an identical version must not fail the job.
          if git diff --cached --quiet; then
            echo "store branch already up to date"
          else
            git commit -q -m "publish $MODULE $VERSION"
            git push -q origin store
            echo "store branch updated: $MODULE $VERSION"
            ls modules/*/ registry/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: module-${{ steps.meta.outputs.module }}-${{ steps.meta.outputs.version }}
          path: publish/modules
          if-no-files-found: error
