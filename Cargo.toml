[workspace]
resolver = "2"
members = [
    "crates/mandala-module-api",
    "crates/mandala-core",
    "crates/mandala-ui",
    "crates/mandala-shell",
    "modules/app-notes",
    "modules/app-calculator",
    "modules/app-terminal",
    "modules/app-aegis",
    "modules/app-vault",
    "modules/app-localsend",
    "modules/app-tasks",
    "modules/app-reader",
    "modules/app-gallery",
    "modules/app-rss",
    "modules/app-weather",
    "modules/app-chat",
    "modules/app-ai",
    "modules/app-camera",
    "tools/mandala-sign",
    "tools/mandala-perf",
    "tools/mandala-android-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["Mandala Team"]

[workspace.dependencies]
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
libloading = "0.8"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
ureq = "3"
roxmltree = "0.20"

mandala-module-api = { path = "crates/mandala-module-api" }
mandala-core = { path = "crates/mandala-core" }
mandala-ui = { path = "crates/mandala-ui" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind" # modules rely on catch_unwind at the FFI boundary
