# Standalone workspace for the app-chat module.
# This module is developed and released from its own branch
# (mod/app-chat); the launcher shell lives on `main`. See release.md.
[workspace]
resolver = "2"
members = [
    "crates/mandala-module-api",
    "modules/app-chat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["Mandala Team"]

# Only the dependencies this workspace actually builds against. Version pins
# mirror the shell's root workspace on `main` so an ABI-tested combination of
# the module API and its dlopen consumer is not accidentally diverged.
[workspace.dependencies]
anyhow = "1"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = "3"
roxmltree = "0.20"
mandala-module-api = { path = "crates/mandala-module-api" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind" # modules rely on catch_unwind at the FFI boundary
